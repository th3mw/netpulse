name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Install frontend dependencies
        run: bun install

      - name: Build and release Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'NetPulse v__VERSION__'
          releaseBody: |
            ## NetPulse v__VERSION__ — Desktop vnStat Telemetry Suite

            ### 📦 Downloads & Installation
            - **Linux (Debian / Ubuntu / Pop!_OS / Mint)**: `.deb` package (auto-depends on `vnstat`)
            - **Linux (Universal)**: `.AppImage`
            - **Linux (Fedora / RHEL / openSUSE)**: `.rpm` package
            - **Arch Linux / AUR**: Install via `yay -S netpulse-bin` or `paru -S netpulse-bin`
            - **macOS**: `.dmg` disk image
            - **Windows**: `.msi` or `.exe` installer

            ### 🌟 Key Features
            - ⚡ Real-time 60-second bandwidth stream with dedicated side Y-axis auto-scaling benchmarks
            - 📊 Side-by-side grouped RX (download) & TX (upload) column charts with scrollable overflow
            - ⏱️ High-resolution 5-minute micro-burst telemetry with table pagination
            - 📅 24-hour, daily, monthly, and yearly historical timelines
            - 🗺️ 7x24 interactive day-of-week network density heatmap
            - 🌟 Starred persistent default interface selection
            - 🎨 6 calibrated themes (Cyber Neon, Graphite macOS Pro, Solar Night Shift, Emerald Terminal, Nordic, macOS Light)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
