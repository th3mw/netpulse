[package]
name = "netpulse"
version = "0.1.0"
description = "Native desktop vnStat telemetry and network bandwidth monitoring suite"
authors = ["th3mw"]
license = "MIT"
repository = "https://github.com/th3mw/netpulse"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }

